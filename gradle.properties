org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# Both of these are required together with AGP 9.x when the project also
# applies `id("org.jetbrains.kotlin.android")` explicitly (see
# app/build.gradle.kts): AGP 9's built-in-Kotlin support and its "new DSL"
# decorated extension otherwise conflict with the explicit Kotlin plugin -
# either "Cannot add extension with name 'kotlin', as there is an extension
# already registered with that name" (missing builtInKotlin=false) or a
# ClassCastException from ApplicationExtensionImpl$AgpDecorated_Decorated
# to BaseExtension (missing newDsl=false), both confirmed by hitting each
# one in turn. Android Studio calls both "deprecated" - that's about their
# long-term future, not about being safe to delete today. Do not remove
# either without also removing the explicit Kotlin plugin id from
# build.gradle.kts in the same change, and re-verifying a full build.
android.builtInKotlin=false
android.newDsl=false
